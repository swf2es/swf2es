name: Setup
description: Node, the workspace installed and built, and what the tests need of the oracle.
inputs:
  oracle:
    description: Pull the oracle's image and restore its store (oracle/store.ts).
    default: "false"
  checked:
    description: Also build the codegen whose every array access is bounds-checked.
    default: "false"
  store:
    description: The name this job keeps the oracle's store under, so parallel jobs save theirs apart.
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm build
    - if: inputs.checked == 'true'
      shell: bash
      run: pnpm --filter @swf2es/codegen build:wasm:checked
    - if: inputs.oracle == 'true'
      shell: bash
      run: pnpm oracle:pull
    # What ASC compiled for the tests. Its entries are content-keyed, so any
    # earlier store helps; a new oracle.ts starts over.
    - if: inputs.oracle == 'true'
      uses: actions/cache@v4
      with:
        # Not abcdump's dumps, nine tenths of the store: abcdump runs again instead.
        path: |
          ~/.cache/swf2es/oracle
          !~/.cache/swf2es/oracle/**/*.dump
        key: oracle-ci-${{ hashFiles('oracle/oracle.ts') }}-${{ inputs.store }}-${{ github.sha }}
        restore-keys: |
          oracle-ci-${{ hashFiles('oracle/oracle.ts') }}-${{ inputs.store }}-
          oracle-ci-${{ hashFiles('oracle/oracle.ts') }}-
