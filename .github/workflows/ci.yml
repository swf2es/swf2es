name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The pinned Zig, which ziglang.org asks CI to cache rather than fetch each run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/swf2es/zig-*
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/zig.ts') }}
      - run: pnpm --filter @swf2es/mp3 build:wasm && git diff --exit-code -- packages/mp3/src/binary.ts packages/mp3/LICENSE.minimp3
      - run: pnpm --filter @swf2es/compress build:wasm && git diff --exit-code -- packages/compress/src/binary.ts packages/compress/LICENSE.zlib
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm oracle:pull
      # The oracle's store (oracle/store.ts): what ASC compiled for the tests below. Its
      # entries are content-keyed, so any earlier store helps; a new oracle.ts starts over.
      - uses: actions/cache@v4
        with:
          # Not abcdump's dumps, nine tenths of the store: abcdump runs again instead.
          path: |
            ~/.cache/swf2es/oracle
            !~/.cache/swf2es/oracle/**/*.dump
          key: oracle-ci-${{ hashFiles('oracle/oracle.ts') }}-${{ github.sha }}
          restore-keys: oracle-ci-${{ hashFiles('oracle/oracle.ts') }}-
      - run: pnpm test
      - run: pnpm test:checked
      - run: pnpm determinism
      # A subset of the Tamarin acceptance tests; the full set runs in tamarin.yml.
      - run: pnpm tamarin ecma3/Array as3/Types
