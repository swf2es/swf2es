name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
# A push to a PR stops the run before it; main and dev run every push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm typecheck
      # Each test package runs in one of the test job's parts below.
      - run: |
          for package in tests/*/package.json; do
            dir=$(dirname "$package")
            if jq -e .scripts.test "$package" > /dev/null && ! grep -q -- "$dir\b" .github/workflows/ci.yml; then
              echo "$dir has tests that no part of the test job runs"
              exit 1
            fi
          done
      # The pinned Zig, which ziglang.org asks CI to cache rather than fetch each run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/swf2es/zig-*
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/zig.ts') }}
      - run: pnpm --filter @swf2es/native build:wasm && git diff --exit-code -- packages/native/src/*/binary.ts packages/native/LICENSE.third-party
  # pnpm test and pnpm test:checked, split into parts that run side by side: the
  # player's cases, a third each, the player's other checks, and the other test
  # packages in two groups.
  test:
    name: test (${{ matrix.mode }}, ${{ matrix.part.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [release, checked]
        part:
          - name: cases 1/3
            run: node tests/player/run.ts --shard 1/3
          - name: cases 2/3
            run: node tests/player/run.ts --shard 2/3
          - name: cases 3/3
            run: node tests/player/run.ts --shard 3/3
          - name: player
            run: pnpm --filter ./tests/player run test:other
          - name: compiler
            run: >-
              pnpm -r --filter ./tests/unit --filter ./tests/conformance --filter ./tests/programs
              --filter ./tests/libraries --filter ./tests/desktop test
          - name: pages and fuzz
            run: pnpm -r --filter ./tests/web --filter ./tests/site --filter ./tests/fuzz test
    env:
      SWF2ES_CHECKED: ${{ matrix.mode == 'checked' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          oracle: "true"
          # pnpm determinism compiles in the checked build too.
          checked: ${{ matrix.mode == 'checked' || matrix.part.name == 'compiler' }}
          store: ${{ matrix.mode }}-${{ matrix.part.name }}
      - run: ${{ matrix.part.run }}
      - if: matrix.mode == 'release' && matrix.part.name == 'player'
        run: node tests/player/run.ts apply-filter apply-filter-inner convolution convolution-draw
        env:
          SWF2ES_NATIVE_BITMAPS: "1"
      # After the conformance and programs runners, whose ABCs it compiles again.
      - if: matrix.mode == 'release' && matrix.part.name == 'compiler'
        run: pnpm determinism
      # A subset of the Tamarin acceptance tests; the full set runs in tamarin.yml.
      - if: matrix.mode == 'release' && matrix.part.name == 'compiler'
        run: pnpm tamarin ecma3/Array as3/Types
  # Ruffle's corpus against tests/player/corpus/baseline.json, beside the tests, so a
  # change that lowers a test's standing fails its PR.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # builtin.abc, which the tests' code links against, comes out of the oracle's image.
      - uses: ./.github/actions/setup
        with:
          oracle: "true"
          store: corpus
      # Fetched, never committed; a commit's corpus never changes, so it keys the cache.
      - id: ruffle
        run: |
          commit=$(sed -n 's/^export const RUFFLE_COMMIT = "\(.*\)";$/\1/p' tests/player/corpus/ruffle.ts)
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: tests/player/corpus/ruffle
          key: ruffle-corpus-${{ steps.ruffle.outputs.commit }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: node tests/player/corpus/fetch-ruffle.ts
      # Saved before the run, which a failing run would otherwise prevent.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/player/corpus/ruffle
          key: ruffle-corpus-${{ steps.ruffle.outputs.commit }}
      - run: pnpm corpus
