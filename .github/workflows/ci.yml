name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm oracle:pull
      - run: pnpm test
      - run: pnpm test:checked
      - run: pnpm determinism
      # A subset of the Tamarin acceptance tests; the full set runs in tamarin.yml.
      - uses: actions/cache@v4
        with:
          path: tests/tamarin/out
          key: tamarin-subset-${{ github.sha }}
          restore-keys: tamarin-subset-
      - run: pnpm tamarin ecma3/Array as3/Types
