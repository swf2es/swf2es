name: Tamarin
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
jobs:
  tamarin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm oracle:pull
      # The oracle's store (oracle/store.ts): its entries are content-keyed, so any
      # earlier store helps; a new oracle.ts starts over.
      - uses: actions/cache@v4
        with:
          # Not abcdump's dumps, nine tenths of the store: abcdump runs again instead.
          path: |
            ~/.cache/swf2es/oracle
            !~/.cache/swf2es/oracle/**/*.dump
          key: oracle-tamarin-${{ hashFiles('oracle/oracle.ts') }}-${{ github.sha }}
          restore-keys: oracle-tamarin-${{ hashFiles('oracle/oracle.ts') }}-
      - run: pnpm tamarin
