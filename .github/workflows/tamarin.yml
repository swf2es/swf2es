name: Tamarin
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
jobs:
  tamarin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          oracle: "true"
          store: tamarin
      - run: pnpm tamarin
