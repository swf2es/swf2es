name: Tamarin
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
jobs:
  tamarin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm oracle:pull
      # Compile keys decide what to recompile, so any earlier output helps.
      - uses: actions/cache@v4
        with:
          path: tests/tamarin/out
          key: tamarin-${{ github.sha }}
          restore-keys: tamarin-
      - run: pnpm tamarin
